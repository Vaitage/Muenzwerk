plugins {
    id "com.android.application"
}

// Signierschlüssel kommt in GitHub Actions aus einem Secret (ANDROID_KEYSTORE_FILE + Passwort).
// Ohne Schlüssel wird mit dem Debug-Schlüssel signiert (lokale Bauten, privates Repo).
def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")

android {
    namespace "io.github.vaitage.muenzwerk"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.vaitage.muenzwerk"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias "muenzwerk"
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            signingConfig keystoreFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        warningsAsErrors false
        checkDependencies false
        textReport true
    }

    testOptions {
        unitTests.returnDefaultValues = false
    }
}

dependencies {
    // Die App selbst braucht keine Bibliotheken. Nur für Tests:
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20260814"   // echtes org.json statt der Android-Attrappe
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
