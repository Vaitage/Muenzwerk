version: 2
updates:
  - package-ecosystem: pip          # requirements.in -> requirements.txt (pip-compile mit Prüfsummen)
    directory: /
    schedule:
      interval: monthly
    groups:
      python-pakete:                  # alle Paket-Updates in einem Vorschlag
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gradle       # Android-Widget (android/)
    directory: /android
    schedule:
      interval: monthly
    groups:
      android:
        patterns: ["*"]
    # Android-Gradle-Plugin 9 braucht Gradle 9.6 und eine Umstellung des Projekts –
    # das als eigene Aufgabe angehen, nicht als Dependabot-Vorschlag (26.10.2026)
    ignore:
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
