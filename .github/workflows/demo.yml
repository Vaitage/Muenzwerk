# Baut die Demo (dist/demo.html, erfundene Daten, läuft komplett im Browser) und veröffentlicht sie
# über GitHub Pages. Nur im öffentlichen Repository; im privaten wird der Schritt übersprungen.
# Einmalig nötig: Settings → Pages → Source „GitHub Actions“.
name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build demo
        run: |
          pip install --require-hashes -r requirements.txt
          python tools/build_demo.py
          mkdir -p _site
          cp dist/demo.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
