name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install --require-hashes -r requirements.txt
          pip install pytest
      - name: Server tests (pytest)
        run: pytest -q
      - name: Calculations and translations (node)
        run: node --test tests/*.test.mjs
      - name: Demo build
        run: python tools/build_demo.py
      - name: Docker image (pinned base image and packages)
        run: docker build -q -t muenzwerk-test .
      - name: UI check (contrast, text size, touch targets)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python tools/ui_pruefung.py
